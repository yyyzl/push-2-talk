name: Platform checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Mac audio dependency
        if: runner.os == 'macOS'
        run: |
          brew install opus
          echo "OPUS_LIB_DIR=$(brew --prefix opus)" >> "$GITHUB_ENV"
          echo "OPUS_STATIC=1" >> "$GITHUB_ENV"
      - name: Configure Windows Opus compatibility
        if: runner.os == 'Windows'
        # audiopus_sys bundles an older Opus CMake project; keep the default ASR enabled.
        run: '"CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV'
      - run: npm ci
      - run: npm run test:ts
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Mac native keyboard acceptance
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-hotkey-native.sh
      - name: Build Windows NSIS prototype
        if: runner.os == 'Windows'
        run: npm run tauri build -- --debug --ci --bundles nsis --config .github/tauri.prototype.conf.json
      - name: Build Mac app prototype
        if: runner.os == 'macOS'
        run: npm run tauri build -- --debug --ci --bundles app --config .github/tauri.prototype.conf.json
      - name: Verify and archive Mac prototype
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/debug/bundle/macos/PushToTalk.app"
          codesign --verify --deep --strict "$app"
          for binary in "$app/Contents/MacOS/"*; do
            otool -L "$binary"
          done > "$RUNNER_TEMP/ptt-linked-libraries.txt"
          if grep -E '/opt/homebrew/|/usr/local/(opt|Cellar)/' "$RUNNER_TEMP/ptt-linked-libraries.txt"; then
            echo "The prototype must not depend on Homebrew dynamic libraries."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/PushToTalk-macOS-prototype.zip"
      - name: Upload prototype for inspection
        uses: actions/upload-artifact@v4
        with:
          name: prototype-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
            ${{ runner.temp }}/PushToTalk-macOS-prototype.zip
          if-no-files-found: error
          retention-days: 7
